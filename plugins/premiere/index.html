<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { color: var(--uxp-host-text-color); background: var(--uxp-host-background-color); font-size: var(--uxp-host-font-size); padding: 8px; }
      main { display: flex; flex-direction: column; gap: 8px; }
      .ptg-title { font-size: 14px; margin: 0; }
      h2 { font-size: 12px; margin: 8px 0 0; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; margin: 0; }
      dt { opacity: 0.7; }
      dd { margin: 0; }
      ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
      .ptg-notes { opacity: 0.7; margin: 0; }
      input, select { width: 100%; }
    </style>
  </head>
  <body>
    <script src="main.js"></script>
  </body>
</html>
