name: Kunnskapsbase
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: Kontroller mandat, kravregister, sporbarhet og skills
        run: python3 scripts/kb/check_kb.py
