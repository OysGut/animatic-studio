  text: "Hovedsiden viser ett felt (boks) per prosjekt. Boksen viser tydelig hvem som eier prosjektet, hvilken rolle brukeren selv har (eier, redaktør, kommentator, leser), antall medlemmer og når prosjektet ble opprettet. Under står hovedfilmen og alle spinoffer, trailere og andre varianter, med avledede produksjoner rykket inn under den de er laget fra. Hver produksjon viser type, dato og notatet om hva den er, og åpner prosjektet med den produksjonen valgt."
