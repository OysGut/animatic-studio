  text: "I stor visning kan brukeren tegne en fri ramme rundt en del av bildet, gi utsnittet navn og lagre det som nytt bilde i et eksisterende eller nytt objekt (alt utenfor blir gjennomsiktig). «Del opp i ruter» deler et karakterark i like store ruter (kolonner × rader) og lagrer hver rute som nytt bilde, i dette objektet eller som nye objekter; tomme ruter hoppes over."
