requirements:
- id: REQ-0001
  title: Fullverdig filmproduksjonsmiljø fra manus til film
  text: Animatic Studio skal være en profesjonell applikasjon for utvikling, planlegging, visualisering, produksjon,
    versjonering og sammenstilling av film, og skal gjøre det mulig å utvikle en film fra første manusutkast til
    ferdig sammenstilt materiale.
  origin: mandat
  source:
    section: '1'
    lines: 7, 24
  type: prinsipp
  priority: P1
  phase: null
  modules:
  - CORE
  invariants: []
  dependencies: []
  acceptance:
  - Gitt et nytt prosjekt, når brukeren importerer et manus, bygger scener, legger lyd og montering, så kan en ferdig
    sammenstilt film eksporteres fra samme prosjekt uten å forlate applikasjonen.
  tests:
  - 'e2e: manus-til-eksport-arbeidsflyt i ett prosjekt'
  status: Verifisert
  implementation:
  - "src/engine/import/browser.ts"
  - "src/core/screenplay/parse.ts"
  - "src/core/composition/render.ts"
  - "src/core/audio/index.ts"
  - "src/core/assembly/film.ts"
  - "src/engine/export/animatic.ts"
  - "src/app/assembly/ExportAnimaticDialog.tsx"
  verification:
  - "tests/integration/manus-til-eksport.test.ts"
  - "tests/visual/export-e2e.mjs"
  history:
  - date: '2026-10-08'
    decision: DEC-0001
    change: Opprettet
  - date: '2026-10-12'
    decision: DEC-0071
    change: "Hele kjeden finnes i ett prosjekt: manusimport, 2D-scener, lyd, montering og eksport av ferdig sammenstilt film; en samlet e2e-test fra manus til eksport mangler."
  - date: '2026-10-12'
    decision: DEC-0072
    change: "Ende-til-ende-test fra manus til eksport (8 tester) og eksport via brukerflaten med Playwright."
  notes: Overordnet formål; konkretiseres i senere kapitler.
- id: REQ-0002
  title: Produktets funksjonsomfang
  text: 'Programmet skal kombinere: profesjonell manusbehandling; automatisk scenedeteksjon og produksjonsanalyse;
    globale biblioteker for karakterer, objekter og lokasjoner; en redigerbar, lagbasert 2D-sceneeditor; kameraanimasjon
    basert på tradisjonell multiplan-teknikk; tidslinje for bilde, lyd, dialog og bevegelser; automatisk generering
    av presise instruksjoner til ulike AI-modeller; integrasjon med eksterne bilde-, lyd- og videogenereringstjenester;
    en selvstendig animatic-motor som ikke er avhengig av AI; profesjonell versjons- og kontinuitetskontroll; renderingskø
    og bakgrunnsproduksjon; flerspråklig manus, dialog og filmeksport; avledede produksjoner, kortfilmer og spinoffer;
    presentasjonsmateriell, pitchplakater og karakterkart; ferdig sammenstilling og eksport av filmer.'
  origin: mandat
  source:
    section: '1'
    lines: 8-23
  type: funksjonell
  priority: P1
  phase: null
  modules:
  - CORE
  - SCRIPT
  - LIBRARY
  - COMPOSE
  - CAMERA
  - TIMELINE
  - AUDIO
  - PROMPT
  - PROVIDER
  - VERSION
  - CONTINUITY
  - QUEUE
  - L10N
  - PRESENT
  - EXPORT
  invariants: []
  dependencies: []
  acceptance:
  - Hvert av de 15 punktene kan spores til minst ett detaljkrav og en fase i utviklingsplanen.
  tests:
  - 'manuell: sporbarhetsmatrise punkt → krav → fase'
  status: Verifisert
  implementation:
  - "src/core/"
  - "src/app/"
  - "docs/development/IMPLEMENTATION_STATUS.md"
  verification:
  - "tests/unit/verifisering4-kjerne.test.ts::REQ-0002: hvert av de 15 punktene spores til minst ett gjeldende detaljkrav med fase i utviklingsplanen"
  - "docs/development/VISUAL_QA_DEC-0076.md"
  history:
  - date: '2026-10-08'
    decision: DEC-0001
    change: Opprettet
  - date: '2026-10-12'
    decision: DEC-0076
    change: "Hvert av de 15 punktene i omfangslisten er kartlagt til gjeldende detaljkrav med fase 1–8, og fasene finnes i ROADMAP.md (test leser kravregisteret)."
  - date: '2026-10-12'
    decision: DEC-0076
    change: "Implementeringsreferanse lagt til."
  notes: Paraplykrav/omfangsliste; hvert punkt detaljeres i senere kapitler. Fasene fordeler punktene over fase
    1–8.
