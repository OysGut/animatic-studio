- id: REQ-0623
  title: "Lag andre vinkler med AI"
  text: "I stor visning kan brukeren velge modell og hvilke vinkler som skal lages av samme karakter eller objekt, som ett karakterark (mest sammenheng, deles opp etterpå) eller ett bilde per vinkel (hver ny vinkel sendes med til neste). Bildet brukeren står i er identiteten; merkede vinkler og to stilforbilder sendes med. Anslaget vises, og ingenting starter før «Ja, generer». Resultatene lagres som nye versjoner merket med vinkel."
