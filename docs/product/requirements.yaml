  - "tests/unit/layer-mask-animation.test.ts"
  - "tests/visual/verifisering3-ui.mjs"
  - "docs/development/VISUAL_QA_DEC-0075.md"
  history:
  - date: '2026-10-08'
    decision: DEC-0001
    change: Opprettet
  - date: '2026-10-08'
    decision: DEC-0001
    change: 'Revisjon 2026-10-08: tekst/prioritet justert mot mandatet'
  - date: '2026-10-12'
    decision: DEC-0071
    change: "Maske (rektangel, ellipse eller et annet lag) og blandingsmodus per lag i 2D-scenen; også i eksport. Masken animeres ikke ennå (KI-166)."
  - date: '2026-10-12'
    decision: DEC-0072
    change: "Masker kan animeres med nøkkelbilder og flyttes/endres med håndtak på lerretet (KI-166)."
  - date: '2026-10-12'
    decision: DEC-0075
    change: "Maske på et bildelag i Chromium (ekte lerret): rektangel, snudd rektangel og ellipse begrenser synlig område til masken; kildebildets piksler og ressursversjonen er uendret. Validering, angre, lagring og animasjon av masken er dekket av eksisterende enhetstester."
