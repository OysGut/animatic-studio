  text: "Med «Vis kun valgt scene» vises scenen rett på siden uten ark: toppjustert, uten sideskift, (MORE), (CONT'D) og sidetall, med manusets innrykk og linjebredde, og den kan rulles. Markering, notater og søk virker som før. «Sort tekst på hvit bakgrunn» gir lys leseflate; valget huskes."
