  text: "Film kan importeres som MP4 (også .m4v), MOV og WebM, også når nettleseren ikke oppgir filtypen; om nettleseren ikke kan spille av kodeken (f.eks. ProRes eller HEVC), forklares det før opplasting. TIFF kan lastes opp som bilde og gjøres om til PNG. Velges en film der det skal være et bilde, forklares hvor film legges inn."
