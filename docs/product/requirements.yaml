  text: "Valgt lag har håndtak midt på hver side i tillegg til hjørnene. Et sidehåndtak skviser eller strekker i én retning mens motsatt side står stille; med Alt endres begge sider likt rundt midten. Det virker også når laget er rotert eller speilvendt."
