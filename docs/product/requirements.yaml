- id: REQ-0620
  title: "Speilvending som tweenes mellom nøkkelbilder"
  text: "«Speilvend» kan virke på hele laget (som før) eller «fra her»: laget snur fra forrige nøkkelbilde (ellers et halvt sekund før) til avspillingshodet, glidende (bildet klemmes smalt og vokser ut speilvendt) eller brått (på ett bilde), og er speilvendt resten av scenen."
