  text: "Etter frilegging kan luften rundt figuren fjernes: bildet beskjæres tett rundt det synlige med litt luft (1 % av lengste side, minst 2 px), som ny versjon. Valget er på som standard i frileggingen og finnes som egen knapp i stor visning. Forhåndsvisningene legger på litt luft, så tett beskårne figurer ikke slår i kanten."
